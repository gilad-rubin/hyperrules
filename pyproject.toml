[project]
name = "rules"
version = "0.1.0"
description = "Tiny zero-dependency predicate->payload rule engine (nestable AND/OR/NOT condition trees)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rules"]

[dependency-groups]
dev = ["pytest>=8.0"]
