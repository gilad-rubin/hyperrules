[project]
name = "hyperrules"
version = "0.4.0"
description = "Tiny zero-dependency predicate->payload rule engine (nestable AND/OR/NOT condition trees)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyperrules"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0"]  # the rule-file codecs (load_rule, save_rule) and their tests read YAML
